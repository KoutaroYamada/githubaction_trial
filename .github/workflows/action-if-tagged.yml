on:
  push:
    branches:
        - 'main'
    tags:
      - 'v*'

jobs:
    action-if-tagged:
        runs-on: ubuntu-latest
        steps:
        - name: action-if-tagged1
          if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          run: |
            echo タグ起動ではありません！！
            echo github.event.ref_type=${{ github.event.ref_type }}

        - name: action-if-tagged2
          if: ${{ startsWith(github.ref, 'refs/tags/v') }}
          run: |
            echo タグ起動です！！

        - name: action-if-tagged3
          if: ${{ github.event.ref_type != 'tag' }}
          run: |
            echo 2-タグ起動ではありません！！
            echo '${{ toJSON(github) }}'
            echo github.event.ref_typeは${{ github.event.ref_type }}

        - name: action-if-tagged4
          if: ${{ github.event.ref_type == 'tag' }}
          run: |
            echo 2-タグ起動です！！
            echo github.event.ref_typeは${{ github.event.ref_type }}