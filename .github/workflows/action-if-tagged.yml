on:
  push:
    branches:
        - 'main'
    tags:
      - 'v*'

jobs:
    action-if-tagged:
        runs-on: ubuntu-latest
        steps:
        - name: action-if-tagged1
          if: github.event.ref_type != 'tag'
          run: |
            echo タグ起動ではありません！！

        - name: action-if-tagged2
          if: github.event.ref_type == 'tag'
          run: |
            echo タグ起動です！！